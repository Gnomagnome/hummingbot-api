name: hummingbot-api
# This file is the human-maintained solve input only. Production images install
# the generated explicit locks under locks/ and never solve this file at build
# time.
platforms:
  - linux-64
  - linux-aarch64
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.12
  # Build/runtime system dependencies live in the same resolved graph so the
  # Docker build does not depend on mutable APT repositories.
  - c-compiler
  - cxx-compiler
  - make
  - libusb
  - cython
  - setuptools
  - wheel
  - fastapi
  - uvicorn
  - boto3
  - libcxx                
  - libta-lib>=0.6.4
  - python-dotenv
  - pandas>=2.3.2
  - numba>=0.61.2
  - numpy>=2.2.6
  - pandas-ta>=0.4.71b
  - ta-lib>=0.6.4
  - tqdm>=4.67.1
  - psutil>=5.9.0
  - docker-py
  - pip
  - pip:
      # Exact core used by the protected Hyperliquid action contract. The API
      # accesses connector/auth fields whose shape must not float at image build.
      - hummingbot @ git+https://github.com/hummingbot/hummingbot.git@2bfaccc48dd49e71a5b6d9b3011808e127dd00cd
      - geckoterminal-py>=0.3.1
      - msgpack>=1.0.5
      - flake8
      - isort
      - pre-commit
      - logfire
      - logfire[fastapi]
      - logfire[system-metrics]
      - aiomqtt>=2.0.0
      - sqlalchemy>=2.0.0
      - asyncpg
      - psycopg2-binary
      - greenlet
      - pydantic-settings
